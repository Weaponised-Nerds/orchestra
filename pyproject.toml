[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zenith-orchestra"
version = "0.1.0"
description = "Cloud-free Home Assistant process hijacker, local hardware liberator, and Conductor demand response orchestrator for Zenith Micro-Node (Z-Node)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary - Zenith Energy / Orchestra" }
authors = [
    { name = "Zenith Micro-Node Engineering" }
]
dependencies = []

[project.optional-dependencies]
ha = [
    "aiohttp>=3.9.0",
    "zeroconf>=0.131.0",
    "pymodbus>=3.6.0",
    "cryptography>=42.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
orchestra = "orchestra.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["orchestra*", "custom_components*"]
