name: "Zenith Orchestra Cloud-Liberation & Commissioning Concierge"
version: "0.1.0"
slug: "orchestra"
description: "Hijacks Home Assistant onboarding, pairs hardware locally without cloud accounts (including iStore Heat Pump, Tuya, Solar/BESS, HVAC, EVSE), identifies switchboard circuits via load-stepping, and builds Grandpa-simple dashboards."
url: "https://zenith.energy/orchestra"
arch:
  - aarch64
  - amd64
  - armv7
startup: system
boot: auto
init: false
host_network: true
host_dbus: true
homeassistant_api: true
hassio_api: true
hassio_role: admin
map:
  - config:rw
  - ssl:rw
  - share:rw
options:
  cloud_liberation_mode: "strict"
  auto_probe_istore_hpwh: true
  auto_identify_circuits: true
  ocpp_server_port: 9000
  tuya_fake_cloud_port: 8886
  ngangk_api_url: "https://ngangk.deeben.workers.dev"
schema:
  cloud_liberation_mode: str
  auto_probe_istore_hpwh: bool
  auto_identify_circuits: bool
  ocpp_server_port: port
  tuya_fake_cloud_port: port
  ngangk_api_url: url
