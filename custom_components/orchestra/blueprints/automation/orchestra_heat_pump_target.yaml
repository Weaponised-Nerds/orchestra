blueprint:
  name: Orchestra - Heat pump from Conductor
  description: >-
    Runs a heat pump from Conductor signals. Energy Soak switches it on and sets the
    `heat_pump` directive's target temperature, kept within the heat pump's own
    min/max (a pool heat pump that tops out at 30 °C gets 30). Load Shed switches it off. Back on Normal it returns
    to exactly what it was doing before: on or off, and its previous temperature and
    operation mode.


    If the heat pump is switched on and off by a separate entity (a power switch),
    pick it below: the switch is then turned on and off, and the water heater only
    has its temperature set and put back.
  domain: automation
  author: Weaponised Nerds
  homeassistant:
    min_version: "2024.10.0"
  source_url: https://github.com/Weaponised-Nerds/orchestra/blob/main/custom_components/orchestra/blueprints/automation/orchestra_heat_pump_target.yaml
  input:
    water_heater:
      name: Heat pump (water heater, climate or switch)
      description: The entity that holds the heat pump's target temperature. Leave empty if it only has a power switch.
      default: ""
      selector:
        entity:
          filter:
            - domain: [water_heater, climate, switch]
    power_switch:
      name: Power switch (optional)
      description: A separate entity that switches the heat pump on and off.
      default: ""
      selector:
        entity:
          filter:
            - domain: [switch, input_boolean, climate, water_heater]
    boost_operation_mode:
      name: Energy Soak operation mode (optional)
      description: >-
        Water heater operation mode while soaking, e.g. "high_demand" or "boost". Must
        be one of the heater's own modes; case doesn't matter.
      default: ""
      selector:
        text: {}
    target_sensor:
      name: Orchestra heat pump target sensor
      default: sensor.orchestra_heat_pump_target_temp
      selector:
        entity:
          filter:
            - integration: orchestra
              domain: sensor
    normal_temperature:
      name: Normal target temperature (no longer used)
      description: Orchestra now puts back the temperature the heat pump had before the event.
      default: 60
      selector:
        number:
          min: 45
          max: 70
          step: 1
          unit_of_measurement: °C
    normal_operation_mode:
      name: Normal operation mode (optional)
      description: >-
        Orchestra puts back the operation mode the heat pump had before the event. If
        your heater doesn't report its mode (e.g. localtuya), this mode is used instead.
        Must be one of the heater's own modes; case doesn't matter.
      default: ""
      selector:
        text: {}

mode: queued
max: 10
max_exceeded: silent

triggers:
  # Any change in the soak setpoint, and every signal change
  - trigger: state
    entity_id: !input target_sensor
    to: null
  - trigger: state
    entity_id: !input target_sensor
    attribute: action
  - trigger: state
    entity_id: !input target_sensor
    attribute: control_signal
  - trigger: state
    entity_id: !input target_sensor
    attribute: run_now
  # Saving this automation; pick up a signal that is already active
  - trigger: event
    event_type: automation_reloaded
  - trigger: homeassistant
    event: start

variables:
  water_heater: !input water_heater
  power_switch: !input power_switch

actions:
  # The response (signal phase and what was done) shows in the trace
  - action: orchestra.apply_heat_pump
    response_variable: heat_pump
    data:
      entity_id: "{{ [water_heater] | reject('in', ['', none]) | list }}"
      power_switch: "{{ [power_switch] | reject('in', ['', none]) | list }}"
      target_sensor: !input target_sensor
      boost_operation_mode: !input boost_operation_mode
      normal_operation_mode: !input normal_operation_mode
