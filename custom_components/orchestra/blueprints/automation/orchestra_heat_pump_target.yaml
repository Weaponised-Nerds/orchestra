blueprint:
  name: Orchestra - Heat pump from Conductor
  description: >-
    Runs a heat pump from Conductor signals. Energy Soak switches it on at its Boost
    setpoint, Load Shed switches it off at its Coast setpoint, and back on Normal it
    returns to on or off as it was before, at its Normal setpoint.


    Set the three setpoints (and operation modes) for this heat pump: a pool heat pump
    might use 30 / 26 / 28 °C, a hot water tank 65 / 50 / 60 °C. Leave a temperature at
    0 to use Conductor's own target for Boost (made for hot water tanks), or what the
    heat pump was set to before the event for Normal. Every temperature is kept within
    the heat pump's own min/max.


    If the heat pump is switched on and off by a separate entity (a power switch),
    pick it below: the switch is then turned on and off, and the water heater only
    has its temperature and mode set.
  domain: automation
  author: Weaponised Nerds
  homeassistant:
    min_version: "2024.10.0"
  source_url: https://github.com/Weaponised-Nerds/orchestra/blob/main/custom_components/orchestra/blueprints/automation/orchestra_heat_pump_target.yaml
  input:
    water_heater:
      name: Heat pump (water heater, climate or switch)
      description: The entity that holds the heat pump's target temperature. Leave empty if it only has a power switch.
      default: ""
      selector:
        entity:
          filter:
            - domain: [water_heater, climate, switch]
    power_switch:
      name: Power switch (optional)
      description: A separate entity that switches the heat pump on and off.
      default: ""
      selector:
        entity:
          filter:
            - domain: [switch, input_boolean, climate, water_heater]
    boost_temperature:
      name: Boost setpoint (Energy Soak)
      description: 0 uses Conductor's own soak target.
      default: 0
      selector:
        number: {min: 0, max: 80, step: 0.5, unit_of_measurement: °C, mode: box}
    boost_operation_mode:
      name: Boost operation mode (optional)
      description: e.g. "boost" or "high_demand". One of the heater's own modes; case doesn't matter.
      default: ""
      selector:
        text: {}
    coast_temperature:
      name: Coast setpoint (Load Shed)
      description: Set as Load Shed starts, before switching off. 0 leaves the temperature alone.
      default: 0
      selector:
        number: {min: 0, max: 80, step: 0.5, unit_of_measurement: °C, mode: box}
    coast_operation_mode:
      name: Coast operation mode (optional)
      description: e.g. "silence" or "eco". One of the heater's own modes; case doesn't matter.
      default: ""
      selector:
        text: {}
    normal_temperature:
      name: Normal setpoint
      description: Set when the event ends. 0 puts back whatever it was set to before.
      default: 0
      selector:
        number: {min: 0, max: 80, step: 0.5, unit_of_measurement: °C, mode: box}
    normal_operation_mode:
      name: Normal operation mode (optional)
      description: >-
        Set when the event ends. Empty puts back the mode it was in before (if the
        heater reports one; localtuya doesn't). One of the heater's own modes; case
        doesn't matter.
      default: ""
      selector:
        text: {}
    target_sensor:
      name: Orchestra heat pump target sensor
      default: sensor.orchestra_heat_pump_target_temp
      selector:
        entity:
          filter:
            - integration: orchestra
              domain: sensor

mode: queued
max: 10
max_exceeded: silent

triggers:
  # Any change in the soak setpoint, and every signal change
  - trigger: state
    entity_id: !input target_sensor
    to: null
  - trigger: state
    entity_id: !input target_sensor
    attribute: action
  - trigger: state
    entity_id: !input target_sensor
    attribute: control_signal
  - trigger: state
    entity_id: !input target_sensor
    attribute: run_now
  # Saving this automation; pick up a signal that is already active
  - trigger: event
    event_type: automation_reloaded
  - trigger: homeassistant
    event: start

variables:
  water_heater: !input water_heater
  power_switch: !input power_switch

actions:
  # The response (signal phase and what was done) shows in the trace
  - action: orchestra.apply_heat_pump
    response_variable: heat_pump
    data:
      entity_id: "{{ [water_heater] | reject('in', ['', none]) | list }}"
      power_switch: "{{ [power_switch] | reject('in', ['', none]) | list }}"
      target_sensor: !input target_sensor
      boost_temperature: !input boost_temperature
      boost_operation_mode: !input boost_operation_mode
      coast_temperature: !input coast_temperature
      coast_operation_mode: !input coast_operation_mode
      normal_temperature: !input normal_temperature
      normal_operation_mode: !input normal_operation_mode
