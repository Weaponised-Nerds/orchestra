apply_hvac_offset:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          filter:
            - domain: climate
          multiple: true
    offset_sensor:
      default: sensor.orchestra_hvac_setpoint_offset
      selector:
        entity:
          filter:
            - integration: orchestra
              domain: sensor
    invert_shed_when_heating:
      default: true
      selector:
        boolean: {}
    skip_when_off:
      default: true
      selector:
        boolean: {}
    turn_on_for_pre:
      default: true
      selector:
        boolean: {}
apply_heat_pump:
  fields:
    entity_id:
      selector:
        entity:
          filter:
            - domain: [water_heater, climate, switch]
          multiple: true
    power_switch:
      selector:
        entity:
          multiple: true
    target_sensor:
      default: sensor.orchestra_heat_pump_target_temp
      selector:
        entity:
          filter:
            - integration: orchestra
              domain: sensor
    boost_operation_mode:
      selector:
        text: {}
    normal_operation_mode:
      selector:
        text: {}
    coast_operation_mode:
      selector:
        text: {}
    boost_temperature:
      selector:
        number: {min: 0, max: 80, step: 0.5, unit_of_measurement: °C, mode: box}
    coast_temperature:
      selector:
        number: {min: 0, max: 80, step: 0.5, unit_of_measurement: °C, mode: box}
    normal_temperature:
      selector:
        number: {min: 0, max: 80, step: 0.5, unit_of_measurement: °C, mode: box}
